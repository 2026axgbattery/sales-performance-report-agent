<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242C32"/>
      <stop offset="1" stop-color="#333F48"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33ACBA"/>
      <stop offset="1" stop-color="#006A76"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect x="0" y="0" width="8" height="320" fill="#EB3300"/>
  </g>

  <g font-family="Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="64" y="84" fill="#66C1CB" font-size="16" font-weight="600" letter-spacing="3">SEBANG · 국내영업본부 국내영업기획팀 · PBL</text>
    <text x="64" y="146" fill="#FFFFFF" font-size="44" font-weight="800">영업실적·손익 분석 및</text>
    <text x="64" y="202" fill="#FFFFFF" font-size="44" font-weight="800">보고서 자동 생성 <tspan fill="#EB3300">Agent</tspan></text>
    <text x="64" y="252" fill="#ADB2B6" font-size="18">SAP 실적 업로드 → 정제·매핑 → 집계 → 이상징후 판정 → 보고서 초안 자동 생성</text>
  </g>

  <!-- 미니 대시보드 카드 -->
  <g transform="translate(800 56)">
    <rect width="336" height="208" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <g font-family="Pretendard, 'Malgun Gothic', sans-serif">
      <text x="20" y="32" fill="#D6D9DA" font-size="13" font-weight="600">팀별 매출액 · 영업이익 추이</text>
      <circle cx="300" cy="27" r="5" fill="#EB3300"/>
      <text x="252" y="32" fill="#F38566" font-size="12" font-weight="600">이상</text>
    </g>
    <line x1="20" y1="176" x2="316" y2="176" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <rect x="30"  y="110" width="22" height="66"  rx="3" fill="url(#bar)"/>
    <rect x="66"  y="92"  width="22" height="84"  rx="3" fill="url(#bar)"/>
    <rect x="102" y="100" width="22" height="76"  rx="3" fill="url(#bar)"/>
    <rect x="138" y="76"  width="22" height="100" rx="3" fill="url(#bar)"/>
    <rect x="174" y="84"  width="22" height="92"  rx="3" fill="url(#bar)"/>
    <rect x="210" y="64"  width="22" height="112" rx="3" fill="url(#bar)"/>
    <rect x="246" y="118" width="22" height="58"  rx="3" fill="#EB3300"/>
    <rect x="282" y="70"  width="22" height="106" rx="3" fill="url(#bar)"/>
    <polyline points="41,96 77,84 113,90 149,66 185,72 221,54 257,128 293,60"
              fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="257" cy="128" r="5" fill="#FFFFFF" stroke="#EB3300" stroke-width="3"/>
    <g font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="11" fill="#858C91">
      <text x="34" y="194">1월</text><text x="142" y="194">4월</text><text x="250" y="194">7월</text>
    </g>
  </g>
</svg>
